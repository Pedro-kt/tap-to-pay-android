codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "60...100"

  status:
    project:
      default:
        target: 70%
        threshold: 5%
        informational: false
    patch:
      default:
        target: 60%
        threshold: 10%
        informational: false

ignore:
  - "app/src/main/java/**/di/**"
  - "app/src/main/java/**/ui/theme/**"
  - "app/src/androidTest/**"
  - "app/src/test/**"
  - "**/R.java"
  - "**/R$*.java"
  - "**/BuildConfig.*"
  - "**/Manifest*.*"
  - "**/*Test*.*"
  - "**/*_HiltModules*"
  - "**/*_Factory*"
  - "**/*_MembersInjector*"
  - "**/Hilt_*"
  - "**/*ComposableSingletons*"
  - "**/*_Impl*"

comment:
  layout: "header, diff, flags, components, tree"
  behavior: default
  require_changes: no
  require_base: no
  require_head: yes
